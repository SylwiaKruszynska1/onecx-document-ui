<div
  class="file-upload-area flex flex-column align-items-center gap-2 p-3 border-1 border-round border-dashed"
  (dragover)="allowDrop($event)"
  (drop)="onDrop($event)"
>
  <span id="dm_file_upload_label">{{ 'FILE_UPLOAD.DRAG_DROP' | translate }}</span>
  <span>{{ 'FILE_UPLOAD.OR' | translate }}</span>

  <div class="upload-btn-wrapper">
    <button
      pButton
      type="button"
      icon="pi pi-plus"
      iconPos="left"
      class="w-full"
      [label]="'FILE_UPLOAD.CHOOSE_BTN' | translate"
      [ariaLabel]="'FILE_UPLOAD.CHOOSE_BTN' | translate"
      [disabled]="disabled"
    ></button>
    <input
      aria-labelledby="dm_file_upload_label"
      type="file"
      [multiple]="multiple"
      [disabled]="disabled"
      (change)="onFileInputChange($event)"
      title
    />
  </div>
</div>
